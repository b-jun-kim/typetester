<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Type Tester</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --border: #111111;
      --panel-bg: #fafafa;
      --accent: #555555;
    }

    body.theme-invert {
      --bg: #111111;
      --text: #ffffff;
      --border: #ffffff;
      --panel-bg: #1c1c1c;
      --accent: #aaaaaa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      font-size: 11px;
      line-height: 1.4;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: background-color 0.2s, color 0.2s;
    }

    /* Fullscreen Mode */
    body.is-fullscreen header,
    body.is-fullscreen .controls,
    body.is-fullscreen .meta-bar {
      display: none !important;
    }

    body.is-fullscreen .tester-container {
      min-height: 100vh;
      height: 100vh;
      padding: 60px;
    }

    #btn-exit-fullscreen {
      display: none;
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 9999;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      opacity: 0.3;
      transition: opacity 0.2s;
    }

    #btn-exit-fullscreen:hover {
      opacity: 1;
      background: var(--text);
      color: var(--bg);
    }

    body.is-fullscreen #btn-exit-fullscreen {
      display: block;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
    }

    .brand-title {
      font-weight: 700;
      letter-spacing: 0.1em;
    }

    select#font-select {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 10px;
      font-size: 10px;
      font-family: inherit;
      text-transform: uppercase;
      outline: none;
      cursor: pointer;
      border-radius: 0;
    }

    select#font-select option {
      background-color: var(--bg);
      color: var(--text);
    }

    /* Controls */
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      border-bottom: 1px solid var(--border);
      background-color: var(--panel-bg);
    }

    .control-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px 16px;
      border-right: 1px solid var(--border);
    }

    .control-item:last-child {
      border-right: none;
    }

    .control-label {
      display: flex;
      justify-content: space-between;
      color: var(--accent);
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 2px;
      background: var(--border);
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      background: var(--text);
      border-radius: 0;
      cursor: pointer;
    }

    .btn-group {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 8px;
      font-size: 10px;
      font-family: inherit;
      cursor: pointer;
      text-transform: uppercase;
      text-align: center;
      transition: all 0.15s ease;
      border-radius: 0;
    }

    button:hover {
      background: var(--text);
      color: var(--bg);
    }

    button.active {
      background: var(--text);
      color: var(--bg);
    }

    /* Tester Stage */
    .tester-container {
      position: relative;
      min-height: calc(100vh - 95px);
      padding: 40px;
      display: flex;
      flex-direction: column;
    }

    #preview {
      flex: 1;
      width: 100%;
      outline: none;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 72px;
      line-height: 1.1;
      letter-spacing: 0em;
      text-align: left;
      text-transform: none;
    }

    /* Meta Bar */
    .meta-bar {
      margin-top: 40px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      color: var(--accent);
      font-size: 10px;
    }
  </style>
</head>
<body>

  <button type="button" id="btn-exit-fullscreen">Exit Fullscreen (ESC)</button>

  <header>
    <div class="brand-title">TYPE TESTER</div>
    <div class="font-select-wrapper">
      <select id="font-select">
        <option>Scanning fonts...</option>
      </select>
    </div>
  </header>

  <div class="controls">
    <div class="control-item">
      <div class="control-label">
        <span>Size</span>
        <span id="val-size">72px</span>
      </div>
      <input type="range" id="input-size" min="12" max="240" value="72">
    </div>

    <div class="control-item">
      <div class="control-label">
        <span>Leading</span>
        <span id="val-leading">1.1</span>
      </div>
      <input type="range" id="input-leading" min="0.7" max="2.5" step="0.05" value="1.1">
    </div>

    <div class="control-item">
      <div class="control-label">
        <span>Tracking</span>
        <span id="val-tracking">0.00em</span>
      </div>
      <input type="range" id="input-tracking" min="-0.15" max="0.5" step="0.01" value="0">
    </div>

    <div class="control-item">
      <div class="control-label">
        <span>Alignment</span>
      </div>
      <div class="btn-group">
        <button type="button" class="btn-align active" data-align="left">Left</button>
        <button type="button" class="btn-align" data-align="center">Center</button>
        <button type="button" class="btn-align" data-align="right">Right</button>
      </div>
    </div>

    <div class="control-item">
      <div class="control-label">
        <span>View</span>
      </div>
      <div class="btn-group">
        <button type="button" id="btn-invert">Invert</button>
        <button type="button" id="btn-fullscreen">Fullscreen</button>
        <button type="button" id="btn-reset">Reset</button>
      </div>
    </div>
  </div>

  <main class="tester-container">
    <div id="preview" contenteditable="true" spellcheck="false">The quick brown fox jumps over the lazy dog.
0123456789 — !@#$%^&*()</div>
    <div class="meta-bar">
      <span id="font-name-indicator">Loaded Font: Initializing...</span>
      <span>UTF-8 / Dynamic Preview</span>
    </div>
  </main>

  <script>
    // GitHub 사용자명과 저장소명
    const GITHUB_USER = 'b-jun-kim';
    const GITHUB_REPO = 'typetester';

    const preview = document.getElementById('preview');
    const fontSelect = document.getElementById('font-select');
    const fontIndicator = document.getElementById('font-name-indicator');

    const inputSize = document.getElementById('input-size');
    const inputLeading = document.getElementById('input-leading');
    const inputTracking = document.getElementById('input-tracking');

    const valSize = document.getElementById('val-size');
    const valLeading = document.getElementById('val-leading');
    const valTracking = document.getElementById('val-tracking');

    const alignBtns = document.querySelectorAll('.btn-align');
    const btnInvert = document.getElementById('btn-invert');
    const btnReset = document.getElementById('btn-reset');
    const btnFullscreen = document.getElementById('btn-fullscreen');
    const btnExitFullscreen = document.getElementById('btn-exit-fullscreen');

    const loadedFontMap = new Map();
    let autoFoundFonts = [];

    // 폰트 파일 동적 로드
    async function applyFont(fileName) {
      fontIndicator.textContent = `Loading: fonts/${fileName}...`;
      const fontUrl = `./fonts/${fileName}`;
      const familyName = `RepoFont_${fileName.replace(/[^a-zA-Z0-9]/g, '_')}`;

      try {
        if (!loadedFontMap.has(fileName)) {
          const font = new FontFace(familyName, `url("${fontUrl}")`);
          await font.load();
          document.fonts.add(font);
          loadedFontMap.set(fileName, familyName);
        }

        const activeFamily = loadedFontMap.get(fileName);
        preview.style.fontFamily = `"${activeFamily}", sans-serif`;
        fontIndicator.textContent = `Loaded Font: fonts/${fileName}`;
      } catch (err) {
        console.error('폰트 로드 실패:', err);
        fontIndicator.textContent = `Error: fonts/${fileName}`;
      }
    }

    // GitHub API를 통해 fonts 폴더를 자동 스캔
    async function autoFetchFonts() {
      const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/fonts`;

      try {
        const res = await fetch(apiUrl);
        if (!res.ok) throw new Error('API 응답 실패');

        const files = await res.json();
        // 폰트 확장자만 필터링
        const fontExtensions = ['.otf', '.ttf', '.woff', '.woff2'];
        autoFoundFonts = files
          .filter(file => file.type === 'file' && fontExtensions.some(ext => file.name.toLowerCase().endsWith(ext)))
          .map(file => file.name);

        fontSelect.innerHTML = '';

        if (autoFoundFonts.length === 0) {
          const opt = document.createElement('option');
          opt.textContent = 'No fonts found in /fonts';
          fontSelect.appendChild(opt);
          fontIndicator.textContent = 'No font files found in fonts/ directory';
          return;
        }

        autoFoundFonts.forEach((fileName) => {
          const opt = document.createElement('option');
          opt.value = fileName;
          opt.textContent = fileName;
          fontSelect.appendChild(opt);
        });

        // 첫 번째 발견된 폰트 자동 적용
        applyFont(autoFoundFonts[0]);

      } catch (err) {
        console.warn('GitHub API 탐색 실패 (로컬 또는 Rate Limit). 폴백 목록을 확인하세요.', err);
        fontSelect.innerHTML = '<option value="Reykjavik-Regular.otf">Reykjavik-Regular.otf</option>';
        applyFont('Reykjavik-Regular.otf');
      }
    }

    fontSelect.addEventListener('change', (e) => {
      applyFont(e.target.value);
    });

    // 슬라이더 및 제어
    inputSize.addEventListener('input', (e) => {
      const val = e.target.value;
      preview.style.fontSize = `${val}px`;
      valSize.textContent = `${val}px`;
    });

    inputLeading.addEventListener('input', (e) => {
      const val = e.target.value;
      preview.style.lineHeight = val;
      valLeading.textContent = val;
    });

    inputTracking.addEventListener('input', (e) => {
      const val = e.target.value;
      preview.style.letterSpacing = `${val}em`;
      valTracking.textContent = `${val}em`;
    });

    alignBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        alignBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        preview.style.textAlign = btn.dataset.align;
      });
    });

    btnInvert.addEventListener('click', () => {
      document.body.classList.toggle('theme-invert');
    });

    btnFullscreen.addEventListener('click', async () => {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        }
        document.body.classList.add('is-fullscreen');
      } catch (err) {
        document.body.classList.add('is-fullscreen');
      }
    });

    btnExitFullscreen.addEventListener('click', async () => {
      if (document.fullscreenElement) {
        await document.exitFullscreen();
      }
      document.body.classList.remove('is-fullscreen');
    });

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        document.body.classList.remove('is-fullscreen');
      }
    });

    btnReset.addEventListener('click', () => {
      inputSize.value = 72;
      inputLeading.value = 1.1;
      inputTracking.value = 0;
      preview.style.fontSize = '72px';
      preview.style.lineHeight = '1.1';
      preview.style.letterSpacing = '0em';
      preview.style.textAlign = 'left';
      valSize.textContent = '72px';
      valLeading.textContent = '1.1';
      valTracking.textContent = '0.00em';
      alignBtns.forEach(b => b.classList.remove('active'));
      document.querySelector('.btn-align[data-align="left"]').classList.add('active');

      if (autoFoundFonts.length > 0) {
        fontSelect.value = autoFoundFonts[0];
        applyFont(autoFoundFonts[0]);
      }
    });

    // 자동 검색 실행
    autoFetchFonts();
  </script>
</body>
</html>
