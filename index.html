<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Type Tester</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --border: #111111;
      --panel-bg: rgba(0, 0, 0, 0.02);
      --accent: #555555;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      font-size: 11px;
      line-height: 1.4;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    /* 전체화면 모드 제어 */
    body.is-fullscreen header,
    body.is-fullscreen .controls,
    body.is-fullscreen .meta-bar {
      display: none !important;
    }

    body.is-fullscreen .tester-container {
      min-height: 100vh;
      height: 100vh;
      padding: 60px;
    }

    #btn-exit-fullscreen {
      display: none;
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 9999;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      opacity: 0.4;
      transition: opacity 0.2s;
    }

    #btn-exit-fullscreen:hover {
      opacity: 1;
      background: var(--text);
      color: var(--bg);
    }

    body.is-fullscreen #btn-exit-fullscreen {
      display: block;
    }

    /* 상단 네비게이션 헤더 */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
    }

    .brand-title {
      font-weight: 700;
      letter-spacing: 0.1em;
    }

    select#font-select {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 10px;
      font-size: 10px;
      font-family: inherit;
      text-transform: uppercase;
      outline: none;
      cursor: pointer;
      border-radius: 0;
    }

    select#font-select option {
      background-color: var(--bg);
      color: var(--text);
    }

    /* 조판 컨트롤 패널 */
    .controls {
      display: flex;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
      background-color: var(--panel-bg);
    }

    .control-item {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      padding: 10px 16px;
      border-right: 1px solid var(--border);
      flex: 1 1 150px;
    }

    .control-item.fullscreen-item {
      flex: 0 0 54px;
      align-items: center;
      justify-content: center;
      border-right: none;
      margin-left: auto;
      padding: 0;
    }

    .control-label {
      display: flex;
      justify-content: space-between;
      color: var(--accent);
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 2px;
      background: var(--border);
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      background: var(--text);
      border-radius: 0;
      cursor: pointer;
    }

    .btn-group {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 8px;
      font-size: 10px;
      font-family: inherit;
      cursor: pointer;
      text-transform: uppercase;
      text-align: center;
      transition: all 0.15s ease;
      border-radius: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    button:hover {
      background: var(--text);
      color: var(--bg);
    }

    button.active {
      background: var(--text);
      color: var(--bg);
    }

    /* Case 버튼 텍스트가 대문자로 강제 변환되지 않도록 격리 */
    button.btn-case {
      text-transform: none !important;
      font-weight: 500;
    }

    /* Fullscreen SVG Icon Button */
    #btn-fullscreen {
      width: 100%;
      height: 100%;
      border: none;
      padding: 0;
    }

    #btn-fullscreen svg {
      width: 15px;
      height: 15px;
      stroke: var(--text);
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: square;
    }

    #btn-fullscreen:hover svg {
      stroke: var(--bg);
    }

    /* 텍스트 편집 영역 */
    .tester-container {
      position: relative;
      min-height: calc(100vh - 95px);
      padding: 40px;
      display: flex;
      flex-direction: column;
    }

    #preview {
      flex: 1;
      width: 100%;
      outline: none;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 72px;
      line-height: 1.1;
      letter-spacing: 0em;
      text-align: left;
      text-transform: uppercase; /* 기본 대문자 시작 */
    }

    /* 하단 메타 바 */
    .meta-bar {
      margin-top: 40px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      color: var(--accent);
      font-size: 10px;
    }
  </style>
</head>
<body>

  <button type="button" id="btn-exit-fullscreen">Exit Fullscreen (ESC)</button>

  <header>
    <div class="brand-title">TYPE TESTER</div>
    <div class="font-select-wrapper">
      <select id="font-select">
        <option>Scanning fonts...</option>
      </select>
    </div>
  </header>

  <div class="controls">
    <div class="control-item">
      <div class="control-label">
        <span>Size</span>
        <span id="val-size">72px</span>
      </div>
      <input type="range" id="input-size" min="12" max="240" value="72">
    </div>

    <div class="control-item">
      <div class="control-label">
        <span>Leading</span>
        <span id="val-leading">1.1</span>
      </div>
      <input type="range" id="input-leading" min="0.7" max="2.5" step="0.05" value="1.1">
    </div>

    <div class="control-item">
      <div class="control-label">
        <span>Tracking</span>
        <span id="val-tracking">0.00em</span>
      </div>
      <input type="range" id="input-tracking" min="-0.15" max="0.5" step="0.01" value="0">
    </div>

    <div class="control-item">
      <div class="control-label">
        <span>Case</span>
      </div>
      <div class="btn-group">
        <button type="button" class="btn-case active" data-case="uppercase">AA</button>
        <button type="button" class="btn-case" data-case="lowercase">aa</button>
        <button type="button" class="btn-case" data-case="none">Aa</button>
      </div>
    </div>

    <div class="control-item">
      <div class="control-label">
        <span>Alignment</span>
      </div>
      <div class="btn-group">
        <button type="button" class="btn-align active" data-align="left">Left</button>
        <button type="button" class="btn-align" data-align="center">Center</button>
        <button type="button" class="btn-align" data-align="right">Right</button>
      </div>
    </div>

    <div class="control-item">
      <div class="control-label">
        <span>View</span>
      </div>
      <div class="btn-group">
        <button type="button" class="btn-theme active" id="btn-theme-white">White</button>
        <button type="button" class="btn-theme" id="btn-theme-black">Black</button>
        <button type="button" class="btn-theme" id="btn-theme-random">Random</button>
      </div>
    </div>

    <div class="control-item fullscreen-item">
      <button type="button" id="btn-fullscreen" title="Fullscreen">
        <svg viewBox="0 0 24 24">
          <polyline points="15 3 21 3 21 9"></polyline>
          <polyline points="9 21 3 21 3 15"></polyline>
          <polyline points="21 15 21 21 15 21"></polyline>
          <polyline points="3 9 3 3 9 3"></polyline>
        </svg>
      </button>
    </div>
  </div>

  <main class="tester-container">
    <div id="preview" contenteditable="true" spellcheck="false">The quick brown fox jumps over the lazy dog.
0123456789 — !@#$%^&*()</div>
    <div class="meta-bar">
      <span id="font-name-indicator">Loaded Font: Initializing...</span>
      <span>UTF-8 / Dynamic Preview</span>
    </div>
  </main>

  <script>
    const GITHUB_USER = 'b-jun-kim';
    const GITHUB_REPO = 'typetester';

    const preview = document.getElementById('preview');
    const fontSelect = document.getElementById('font-select');
    const fontIndicator = document.getElementById('font-name-indicator');

    const inputSize = document.getElementById('input-size');
    const inputLeading = document.getElementById('input-leading');
    const inputTracking = document.getElementById('input-tracking');

    const valSize = document.getElementById('val-size');
    const valLeading = document.getElementById('val-leading');
    const valTracking = document.getElementById('val-tracking');

    const caseBtns = document.querySelectorAll('.btn-case');
    const alignBtns = document.querySelectorAll('.btn-align');
    const themeBtns = document.querySelectorAll('.btn-theme');

    const btnThemeWhite = document.getElementById('btn-theme-white');
    const btnThemeBlack = document.getElementById('btn-theme-black');
    const btnThemeRandom = document.getElementById('btn-theme-random');

    const btnFullscreen = document.getElementById('btn-fullscreen');
    const btnExitFullscreen = document.getElementById('btn-exit-fullscreen');

    const loadedFontMap = new Map();
    let autoFoundFonts = [];

    async function applyFont(fileName) {
      fontIndicator.textContent = `Loading: fonts/${fileName}...`;
      const fontUrl = `./fonts/${fileName}`;
      const familyName = `RepoFont_${fileName.replace(/[^a-zA-Z0-9]/g, '_')}`;

      try {
        if (!loadedFontMap.has(fileName)) {
          const font = new FontFace(familyName, `url("${fontUrl}")`);
          await font.load();
          document.fonts.add(font);
          loadedFontMap.set(fileName, familyName);
        }

        const activeFamily = loadedFontMap.get(fileName);
        preview.style.fontFamily = `"${activeFamily}", sans-serif`;
        fontIndicator.textContent = `Loaded Font: fonts/${fileName}`;
      } catch (err) {
        console.error('폰트 로드 실패:', err);
        fontIndicator.textContent = `Error: fonts/${fileName}`;
      }
    }

    async function autoFetchFonts() {
      const apiUrl = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/fonts`;

      try {
        const res = await fetch(apiUrl);
        if (!res.ok) throw new Error('API 응답 실패');

        const files = await res.json();
        const fontExtensions = ['.otf', '.ttf', '.woff', '.woff2'];
        autoFoundFonts = files
          .filter(file => file.type === 'file' && fontExtensions.some(ext => file.name.toLowerCase().endsWith(ext)))
          .map(file => file.name);

        fontSelect.innerHTML = '';

        if (autoFoundFonts.length === 0) {
          const opt = document.createElement('option');
          opt.textContent = 'No fonts found in /fonts';
          fontSelect.appendChild(opt);
          fontIndicator.textContent = 'No font files found in fonts/ directory';
          return;
        }

        autoFoundFonts.forEach((fileName) => {
          const opt = document.createElement('option');
          opt.value = fileName;
          opt.textContent = fileName;
          fontSelect.appendChild(opt);
        });

        applyFont(autoFoundFonts[0]);

      } catch (err) {
        console.warn('API 탐색 폴백 가동', err);
        fontSelect.innerHTML = '<option value="Reykjavik-Regular.otf">Reykjavik-Regular.otf</option>';
        applyFont('Reykjavik-Regular.otf');
      }
    }

    fontSelect.addEventListener('change', (e) => {
      applyFont(e.target.value);
    });

    inputSize.addEventListener('input', (e) => {
      const val = e.target.value;
      preview.style.fontSize = `${val}px`;
      valSize.textContent = `${val}px`;
    });

    inputLeading.addEventListener('input', (e) => {
      const val = e.target.value;
      preview.style.lineHeight = val;
      valLeading.textContent = val;
    });

    inputTracking.addEventListener('input', (e) => {
      const val = e.target.value;
      preview.style.letterSpacing = `${val}em`;
      valTracking.textContent = `${val}em`;
    });

    // Case 전환 핸들러
    caseBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        caseBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        preview.style.textTransform = btn.dataset.case;
      });
    });

    alignBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        alignBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        preview.style.textAlign = btn.dataset.align;
      });
    });

    function setActiveThemeButton(activeBtn) {
      themeBtns.forEach(b => b.classList.remove('active'));
      if (activeBtn) activeBtn.classList.add('active');
    }

    function applyThemeColors(bgHex, textHex, accentHex) {
      document.documentElement.style.setProperty('--bg', bgHex);
      document.documentElement.style.setProperty('--text', textHex);
      document.documentElement.style.setProperty('--border', textHex);
      document.documentElement.style.setProperty('--accent', accentHex || textHex);
    }

    btnThemeWhite.addEventListener('click', () => {
      setActiveThemeButton(btnThemeWhite);
      applyThemeColors('#ffffff', '#111111', '#555555');
    });

    btnThemeBlack.addEventListener('click', () => {
      setActiveThemeButton(btnThemeBlack);
      applyThemeColors('#111111', '#ffffff', '#aaaaaa');
    });

    btnThemeRandom.addEventListener('click', () => {
      setActiveThemeButton(btnThemeRandom);

      const r = Math.floor(Math.random() * 256);
      const g = Math.floor(Math.random() * 256);
      const b = Math.floor(Math.random() * 256);

      const compR = 255 - r;
      const compG = 255 - g;
      const compB = 255 - b;

      const bgHex = `rgb(${r}, ${g}, ${b})`;
      const textHex = `rgb(${compR}, ${compG}, ${compB})`;

      applyThemeColors(bgHex, textHex, textHex);
    });

    btnFullscreen.addEventListener('click', async () => {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        }
        document.body.classList.add('is-fullscreen');
      } catch (err) {
        document.body.classList.add('is-fullscreen');
      }
    });

    btnExitFullscreen.addEventListener('click', async () => {
      if (document.fullscreenElement) {
        await document.exitFullscreen();
      }
      document.body.classList.remove('is-fullscreen');
    });

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        document.body.classList.remove('is-fullscreen');
      }
    });

    autoFetchFonts();
  </script>
</body>
</html>
